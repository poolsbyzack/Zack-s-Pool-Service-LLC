name: Daily Cron Job

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 4 AM UTC

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily cron
        run: |
          curl -X POST \
            "${{ secrets.RENDER_URL }}/api/cron/daily?key=${{ secrets.CRON_SECRET }}" \
            -H "User-Agent: GitHub Actions"
